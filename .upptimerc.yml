# Public status page of CheeseCave (prototype). Probes public, read-only endpoints only.
owner: deepghs
repo: cheesecave-status

sites:
  - name: Website
    url: https://hub.deepghs.org/
    maxResponseTime: 10000
  - name: API
    url: https://hub.deepghs.org/api/version
    maxResponseTime: 10000
  - name: Repository listing
    url: https://hub.deepghs.org/api/datasets/deepghs/gelbooru_full/tree/main
    maxResponseTime: 10000
  - name: File download
    url: https://hub.deepghs.org/datasets/deepghs/gelbooru_full/resolve/main/meta.json
    headers:
      - "Range: bytes=0-1023"
    expectedStatusCodes:
      - 200
      - 206
      - 302
    maxResponseTime: 10000

status-website:
  baseUrl: /cheesecave-status
  name: CheeseCave Status
  introTitle: "**CheeseCave** service status"
  introMessage: Live checks of the public website, the API, repository listing and file download. Checked every 5 minutes from GitHub; a delayed check shows as stale, not as healthy.
  navbar:
    - title: Status
      href: /
    - title: CheeseCave
      href: https://hub.deepghs.org
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
