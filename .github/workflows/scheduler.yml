# GitHub's own `schedule` trigger is best-effort: on this repository it fired every ~3.3 hours
# instead of every 5 minutes. This job is the scheduler instead: it dispatches Uptime CI every
# 5 minutes for about 5h40m, then dispatches the next copy of itself (queued behind this one by
# the concurrency group, so there is no gap). The hourly `schedule` below only restarts the
# chain if it ever breaks. workflow_dispatch is allowed with the default token, no secret needed.
name: Scheduler
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: scheduler
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  tick:
    name: Dispatch a check every 5 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Loop
        run: |
          end=$(( $(date +%s) + 5*3600 + 40*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            next=$(( $(date +%s) + 300 ))
            gh workflow run uptime.yml --ref "${GITHUB_REF_NAME}" || echo "dispatch failed, will retry next round"
            now=$(date +%s)
            [ "$next" -gt "$now" ] && sleep $(( next - now ))
          done
      - name: Hand over to the next copy
        run: gh workflow run scheduler.yml --ref "${GITHUB_REF_NAME}"
