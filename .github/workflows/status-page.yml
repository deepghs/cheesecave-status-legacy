# Builds the status page (site/ + scripts/build_status.py) and publishes it with the
# official Pages actions (not subject to the 10-builds-per-hour limit of branch builds).
# This replaces Upptime's stock "Static Site CI" (site.yml, removed on purpose).
name: Status Page
on:
  workflow_run:
    workflows: ["Uptime CI"]
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/**"
      - ".upptimerc.yml"
      - ".github/workflows/status-page.yml"
concurrency:
  group: status-page
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the last 96 days of history
        run: git fetch --quiet --shallow-since="$(date -u -d '96 days ago' +%Y-%m-%d)" origin "${GITHUB_REF_NAME}"
      - name: Test the data builder
        run: python3 -I scripts/test_build_status.py
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_status.py --out public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
